name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, lts/*]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # The ruleset on main requires a check named "test": this one stands for
  # every Node version in the matrix, so the requirement survives matrix changes.
  test:
    needs: node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.node.result }}" = success
